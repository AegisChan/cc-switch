name: Build CC Switch Installer

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Disable updater signing and build full installer
        run: |
          node -e "const fs=require('fs'); const p='src-tauri/tauri.conf.json'; const c=JSON.parse(fs.readFileSync(p,'utf8')); if(c.bundle&&c.bundle.createUpdaterArtifacts) c.bundle.createUpdaterArtifacts=false; if(c.plugins&&c.plugins.updater) c.plugins.updater.pubkey=''; fs.writeFileSync(p, JSON.stringify(c, null, 2));"
          pnpm tauri build

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CC-Switch-Full-Installer
          path: |
            src-tauri/target/release/bundle/nsis/*setup.exe
            src-tauri/target/release/cc-switch.exe
