name: Build CC Switch

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build Tauri app (without updater signature)
        run: |
          # 临时禁用更新器签名检查，仅编译生产环境二进制
          node -e "const fs=require('fs'); const p='src-tauri/tauri.conf.json'; const c=JSON.parse(fs.readFileSync(p,'utf8')); if(c.plugins&&c.plugins.updater) delete c.plugins.updater; fs.writeFileSync(p, JSON.stringify(c, null, 2));"
          pnpm tauri build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CC-Switch-Fixed-Binary
          path: |
            src-tauri/target/release/cc-switch.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
